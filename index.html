<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯 HTML/CSS 伪装网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #1a2415;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 伪装网主容器 */
        .camo-net-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3b4224; /* 底层暗绿 */
        }

        /* 1. 迷彩纹理层（利用 SVG 滤镜与颜色叠加） */
        .camo-pattern {
            position: absolute;
            inset: 0;
            /* 叠加多重深绿、棕色与暗绿 */
            background: 
                radial-gradient(circle at 20% 30%, #2e3b1f 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, #1e2617 0%, transparent 60%),
                radial-gradient(circle at 40% 80%, #4d3d28 0%, transparent 50%),
                #3b4a2d;
            filter: url(#camo-noise) contrast(180%) brightness(90%);
        }

        /* 2. 网状结构与掏空切片层 */
        .net-mesh {
            position: absolute;
            inset: 0;
            /* 使用 CSS radial-gradient 模拟伪装网的叶片镂空孔洞 */
            background-image: 
                radial-gradient(circle, transparent 35%, rgba(0, 0, 0, 0.8) 40%, rgba(0,0,0,1) 70%),
                radial-gradient(circle, transparent 35%, rgba(0, 0, 0, 0.8) 40%, rgba(0,0,0,1) 70%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            mix-blend-mode: multiply;
        }

        /* 3. 网格绳线图层 */
        .grid-lines {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* 4. 阴影与深度（模拟挂载悬空感） */
        .camo-shadow {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="camo-net-container">
        <!-- 迷彩底纹 -->
        <div class="camo-pattern"></div>
        <!-- 镂空叶片网孔 -->
        <div class="net-mesh"></div>
        <!-- 结构网格线 -->
        <div class="grid-lines"></div>
        <!-- 边缘暗角阴影 -->
        <div class="camo-shadow"></div>
    </div>

    <!-- 用于生成随机不规则迷彩斑块的 SVG 噪声滤镜 -->
    <svg style="display: none;">
        <defs>
            <filter id="camo-noise" x="0%" y="0%" width="100%" height="100%">
                <!-- 生成柏林噪声 -->
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" result="noise" />
                <!-- 增强噪点边界，形成块状迷彩边缘 -->
                <feComponentTransfer>
                    <feFuncR type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1" />
                    <feFuncG type="discrete" tableValues="0 0.3 0.5 0.7 0.9 1" />
                    <feFuncB type="discrete" tableValues="0 0.2 0.3 0.5 0.7 1" />
                </feComponentTransfer>
            </filter>
        </defs>
    </svg>

</body>
</html>
